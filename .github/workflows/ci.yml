name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # tfjs-node's native download is slow and unneeded for typecheck/tests
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.json --noEmit

      - name: Typecheck web app
        run: pnpm --filter @workspace/lms-web exec tsc -p tsconfig.json --noEmit

      - name: API server tests
        run: pnpm --filter @workspace/api-server exec vitest run
